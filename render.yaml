services:
  - type: web
    name: incrubrix-content-engine
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node backend/app/server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: AI_PROVIDER
        value: demo
      - key: DATABASE_PATH
        value: /var/data/incrubrix.sqlite
      - key: BASIC_AUTH_USERNAME
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
    disk:
      name: incrubrix-data
      mountPath: /var/data
      sizeGB: 1
