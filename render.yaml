services:
  - type: web
    name: incrubrix-content-engine
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node backend/app/server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: AI_PROVIDER
        value: demo
      - key: DATABASE_PATH
        value: /tmp/incrubrix.sqlite
